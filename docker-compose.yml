# docker-compose.yml — 一键起站（零前置文件也能跑）
#
#   1) docker compose up -d --build
#   2) docker compose logs genshin-hub     ← 首次启动会打印随机管理员密码
#   3) 打开 http://localhost:3001  （管理后台 /#admin）
#
# 数据持久化：一份 ./data 卷包含配置、管理员凭据、Kuma 密钥、备份与上传文件。
# 想用 server/.env 里的配置？取消下方 volumes 中那一行注释即可。
services:
  genshin-hub:
    build:
      context: .
      args:
        # 国内 / NAS 拉不到 docker.io 时，在 .env 里设 NODE_IMAGE=docker.1panel.live/library/node:22-alpine
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: genshin-hub:latest
    container_name: genshin-hub
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # 所有可变数据集中在此目录（已挂载为卷）
      DATA_DIR: /data
      TZ: Asia/Shanghai
      # 需要固定凭据时在此填写（留空则首次启动自动生成并打印）
      # JWT_SECRET: ''
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: ''
      # 想直接用 https（不装 Nginx）就填证书；PEM 或 .pfx 都行
      # SSL_CERT: /data/certs/fullchain.pem
      # SSL_KEY: /data/certs/privkey.pem
      # SSL_PFX: /data/certs/site.pfx
      # SSL_PFX_PASSPHRASE: ''
      # HTTPS_REDIRECT_PORT: '80'
    volumes:
      # 绑定挂载：容器启动时会先修正属主再降权运行（见 docker-entrypoint.sh）
      # 若宿主机上权限受限（NFS root_squash 等），改用手动 chown：
      #   chown -R 1000:1000 ./data
      - ./data:/data
      # - ./certs:/data/certs:ro   # 证书放这里，配合上面的 SSL_* 使用
      # - genshin-hub-data:/data   # 或者用命名卷（免权限烦恼）
      # - ./server/.env:/app/server/.env:ro   # 想复用 server/.env 时启用
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

# 用命名卷（想免掉绑定挂载的权限问题时，把上面的 ./data:/data 换成下面这两行）
# volumes:
#   genshin-hub-data:
